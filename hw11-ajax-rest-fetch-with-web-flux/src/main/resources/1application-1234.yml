spring:
  messages:
    encoding: UTF-8

  data:
    mongodb:
      uri: mongodb://localhost:27017/book_catalog
      database: book_catalog
      auto-index-creation: true
      host: localhost
      port: 27017
      username: admin
      password: password
      authentication-database: admin

  webflux:
    base-path: /api
    static-path-pattern: /**

  web:
    resources:
      static-locations:
        - classpath:/static/
        - classpath:/static/book/

  application:
    name: book-catalog-reactive

# Серверная конфигурация для WebFlux (Netty)
server:
  port: 8080
  servlet:
    context-path: /
  netty:
    connection-timeout: 2000
    idle-timeout: 30000


# Логирование
logging:
  level:
    ROOT: INFO
    ru.otus.hw: DEBUG
    ru.otus.hw.controllers: DEBUG
    ru.otus.hw.services: DEBUG
    org.springframework.data.mongodb.core: DEBUG
    reactor.netty: INFO
    # Для отладки запросов
    org.springframework.web.reactive: DEBUG
    # Для отладки запросов к MongoDB
    org.springframework.data.mongodb: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %highlight(%-5level) - %cyan(%logger{36}) - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  # Файловый логгер
  file:
    name: logs/book-catalog.log
    max-size: 10MB
    max-history: 30

# Кастомные настройки приложения
app:
  pagination:
    default-page-size: 20
    max-page-size: 100


